[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-state-classifier"
version = "0.2.0"
description = "Audited multichannel EEG experiments with participant-disjoint evaluation and batch inference."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Harvey Phan" }]
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numpy>=2.0",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.12"
]
serial = [
    "pyserial>=3.5"
]
benchmark = [
    "mne>=1.9,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
